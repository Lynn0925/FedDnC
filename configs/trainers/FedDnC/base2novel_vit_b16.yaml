DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 32
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 8

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "random_flip", "normalize"]

OPTIM:
  NAME: "sgd"
  LR: 0.002
  LR_SCHEDULER: "single_step"
  ROUND: 100     # T=100 communication rounds
  MAX_EPOCH: 5   # E=5 local epochs per round
  WARMUP_EPOCH: 0
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1e-5
  GAMMA: 1

TRAIN:
  PRINT_FREQ: 20

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"
    PRETRAINED: True

DATASET:
  SUBSAMPLE_CLASSES: "base"
  USERS: 10         # K=10 clients
  IID: False
  FRAC: 1.0
  PARTITION: "noniid-labeldir"
  USEALL: False
  NUM_SHOTS: 8      # 8-shot per base class
  BETA: 0.3         # Dirichlet Dir(beta=0.3)
  REPEATRATE: 0.0
  IMBALANCE_TRAIN: False
  SPLIT_CLIENT: False

TRAINER:
  FEDNC:
    N_CTX: 4          # L=4 context tokens
    N: 2              # N=2 prompt replicas per stream
    CTX_INIT: ""
    PREC: "fp16"
    CSC: False
    CLASS_TOKEN_POSITION: "end"
    # Loss weights (tuned on Flowers102, fixed across datasets)
    LAMBDA_KD: 1.0    # weight for L_kd + L_align
    BETA_DIV: 0.1     # weight for L_feat + L_div
    MU_PROX: 0.01     # FedProx proximal term weight
    # Aggregation
    EMA_ALPHA: 0.9    # EMA momentum for P_n aggregation
    # KD temperature
    KD_TEMP: 4.0
    # OT (used internally, not primary for text-only mode)
    THRESH: 0.001
    EPS: 0.1
    OT: "COT"
    TOP_PERCENT: 0.80
    MAX_ITER: 100
