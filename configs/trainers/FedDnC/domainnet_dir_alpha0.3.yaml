DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 4
    # N_DOMAIN: 4  # number of domain 
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 16

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "random_flip", "normalize"]

OPTIM:
  NAME: "sgd"
  LR: 0.001
  LR_SCHEDULER: "single_step"
  ROUND: 10      # global communication rounds
  MAX_EPOCH: 2   # local epochs per round
  WARMUP_EPOCH: 0
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1e-5
  GAMMA: 1       # gamma of single-step

TRAIN:
  PRINT_FREQ: 5

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"
    PRETRAINED: True

DATASET:
  SUBSAMPLE_CLASSES: "base"
  USERS: 10  
  IID: False  
  FRAC: 1.0
  PARTITION: "noniid-labeldir"
  USEALL: False  
  NUM_SHOTS: 4
  BETA: 0.3
  REPEATRATE: 0.0  
  IMBALANCE_TRAIN: False  
  SPLIT_CLIENT: False  
TRAINER:
  FEDNC:
    LAMBDA_KD: 1.0   # weight for KD + alignment losses (tuned on Flowers102)
    N_CTX: 16
    CSC: False
    CTX_INIT: ""
    PREC: "fp16"
    CLASS_TOKEN_POSITION: "end"
    N: 2  
    THRESH: 0.001
    EPS: 0.1
    OT: "COT"
    TOP_PERCENT: 0.80
    MAX_ITER: 100
    BETA_DIV: 0.1   # weight for diversity loss between P_b and P_n